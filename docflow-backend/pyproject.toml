[project]
name = "docflow-backend"
version = "0.1.0"
description = "DocFlow.ai backend — ambient AI medical scribe"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "email-validator>=2.2.0",
    "openai>=1.50.0",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "httpx-ws>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "TID", # flake8-tidy-imports — enforces the openai import boundary below
]
ignore = [
    "UP042", # classic `str, Enum` mixin kept deliberately over StrEnum: its
    # __str__ differs (StrEnum returns the raw value; the mixin returns
    # "ClassName.member"), and nothing here relies on that distinction.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Fast, CI-native complement to tests/test_transcription_isolation.py and
# tests/test_notes_isolation.py: the `openai` SDK must only ever be
# imported from app/transcription/openai.py or app/notes/openai.py
# (re-enabled via per-file-ignores below), so nothing downstream can
# accidentally couple to it.
"openai" = { msg = "Import openai only inside app/transcription/openai.py or app/notes/openai.py — see those modules' docstrings." }

[tool.ruff.lint.per-file-ignores]
# Alembic's own revision template uses typing.Sequence/Union and leaves
# trailing whitespace in the header; keep migrations close to Alembic's
# generated form rather than hand-polishing every revision.
"alembic/versions/*.py" = ["E501", "UP035", "UP007", "I001", "W291"]
# The one application file allowed to import the openai SDK — see the
# banned-api rule above and tests/test_transcription_isolation.py.
"app/transcription/openai.py" = ["TID251"]
"app/notes/openai.py" = ["TID251"]
# Unit tests for OpenAITranscriber/OpenAINoteGenerator construct real SDK
# exception instances to verify error translation — see those test
# modules' docstrings for why this doesn't weaken the isolation
# guarantee (it's scoped to app/).
"tests/test_transcription_openai.py" = ["TID251"]
"tests/test_notes_openai.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3 is a deliberately optional, lazily-imported dependency (see
# app/security/keys.py's AwsKmsProvider) — not installed in dev/test,
# where KEY_PROVIDER=local always.
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped, not the default per-test loop: app/db/session.py's
# engines are process-lifetime @lru_cache singletons (matching production,
# where one engine serves the whole app), so their connection pools must
# stay bound to a single event loop for the whole test session — a fresh
# loop per test would hand asyncpg connections created on a since-closed
# loop back to a new one, which is silently broken on Windows.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]
