services:
  app:
    build: .
    env_file:
      - .env
    # Override the host-oriented DSNs from .env with the compose network's
    # internal service hostnames/ports.
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow@db:5432/docflow
      APP_DATABASE_URL: postgresql+asyncpg://docflow_app:docflow_app_dev_only@db:5432/docflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    volumes:
      - docflow_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docflow_db_data:
